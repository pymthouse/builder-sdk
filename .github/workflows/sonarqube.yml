name: SonarQube Community

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: SonarQube Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check scanner credentials
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_COMMUNITY_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          test -n "$SONAR_TOKEN" || { echo "::error::SONAR_COMMUNITY_TOKEN is required. Fork PRs require a maintainer-controlled branch."; exit 1; }
          test -n "$SONAR_HOST_URL" || { echo "::error::SONAR_HOST_URL is required."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Scan and enforce quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_COMMUNITY_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha || github.sha }}
